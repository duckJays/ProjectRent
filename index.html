<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TESTING — Find your next place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="navbar">
    <div class="logo"><span class="dot"></span> Haven</div>
    <div class="navlinks">
      <button class="active" data-view="browse">Browse</button>
      <button data-view="favorites">Favorites</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="whoami" style="font-size:.85rem;color:var(--ink-soft)"></span>
      <button class="btn btn-ghost btn-sm" id="authBtn">Log in</button>
    </div>
  </div>
</nav>

<main>
  <!-- BROWSE VIEW -->
  <section id="view-browse">
    <div class="wrap">
      <div class="hero">
        <h1>UPAHAN NI ATE MHEAN</h1>
        <p>Search verified rentals by location, price and the things that matter to your day-to-day.</p>
        <div class="searchbar">
          <div class="field"><label>Location</label><input id="f-location" placeholder="City or neighborhood"></div>
          <div class="field"><label>Max price / month</label><input id="f-price" type="number" placeholder="₱ 25,000"></div>
          <div class="field"><label>Property type</label>
            <select id="f-type"><option value="">Any type</option><option>Apartment</option><option>Condo</option><option>Studio</option><option>House</option></select>
          </div>
          <div class="field"><label>Occupants</label>
            <select id="f-occ"><option value="">Any</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
          </div>
          <button class="btn btn-brass" id="searchBtn">Search</button>
        </div>
        <div class="amenity-row" id="amenityRow"></div>
      </div>
      <div class="section-head"><h2 id="listHeading">Available rentals</h2><span class="count" id="listCount"></span></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- FAVORITES VIEW -->
  <section id="view-favorites" style="display:none">
    <div class="wrap">
      <div class="section-head" style="margin-top:32px"><h2>Your saved properties</h2><span class="count" id="favCount"></span></div>
      <div class="grid" id="favGrid"></div>
    </div>
  </section>

  <!-- Property owner submission and admin dashboard come in a later phase -->
</main>

<footer>TESTING TESTING TESING TESTING TESTING</footer>

<!-- AUTH MODAL -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('authOverlay')">✕</button>
    <div class="tabs"><button class="active" data-tab="login">Log in</button><button data-tab="register">Register</button></div>
    <form id="loginForm">
      <div class="field" style="margin-bottom:12px"><label>Email</label><input required type="email" id="l-email"></div>
      <div class="field" style="margin-bottom:12px"><label>Password</label><input required type="password" id="l-pass"></div>
      <button class="btn btn-brass" style="width:100%" type="submit">Log in</button>
    </form>
    <form id="registerForm" style="display:none">
      <div class="formgrid">
        <div class="full"><label>Full name</label><input required id="r-name"></div>
        <div><label>Email</label><input required type="email" id="r-email"></div>
        <div><label>Mobile number</label><input required id="r-mobile"></div>
        <div class="full"><label>Password</label><input required type="password" id="r-pass"></div>
      </div>
      <button class="btn btn-brass" style="width:100%;margin-top:14px" type="submit">Create account</button>
    </form>
  </div>
</div>

<!-- PROPERTY DETAIL MODAL -->
<div class="overlay" id="detailOverlay">
  <div class="modal wide" id="detailBody"></div>
</div>

<!-- INQUIRY MODAL -->
<div class="overlay" id="inquiryOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('inquiryOverlay')">✕</button>
    <h3>Send an inquiry</h3>
    <form id="inquiryForm">
      <input type="hidden" id="inq-pid">
      <div style="margin-bottom:12px"><label>Your name</label><input required id="inq-name"></div>
      <div style="margin-bottom:12px"><label>Your email</label><input required type="email" id="inq-email"></div>
      <div style="margin-bottom:12px"><label>Message</label><textarea required id="inq-msg" rows="3" placeholder="I'd like to schedule a visit..."></textarea></div>
      <button class="btn btn-brass" style="width:100%" type="submit">Send inquiry</button>
    </form>
  </div>
</div>

<!-- REPORT MODAL -->
<div class="overlay" id="reportOverlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('reportOverlay')">✕</button>
    <h3>Report this listing</h3>
    <form id="reportForm">
      <input type="hidden" id="rep-pid">
      <div style="margin-bottom:12px"><label>Reason</label>
        <select id="rep-reason" style="width:100%"><option>Suspicious / likely scam</option><option>Inaccurate information</option><option>Outdated / already rented</option><option>Other</option></select>
      </div>
      <div style="margin-bottom:12px"><label>Details</label><textarea id="rep-details" rows="3"></textarea></div>
      <button class="btn btn-danger" style="width:100%" type="submit">Submit report</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
